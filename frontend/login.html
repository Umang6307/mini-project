<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Onboarding - Smart Crop Advisory</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div style="max-width: 480px; width: 100%;">
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #40916c, #1b4332); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 12px;">
        🌾
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Smart Crop Advisory</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Farmer Portal & Digital Control Center</p>
    </div>

    <!-- Demo Profiles Card for Evaluators -->
    <div class="card" style="border: 2px dashed var(--primary-light); background: var(--bg-muted); margin-bottom: 20px; padding: 16px;">
      <div style="font-size: 0.78rem; font-weight: bold; text-transform: uppercase; color: var(--primary-light); margin-bottom: 8px;">
        ⚡ Evaluator One-Click Demo Mode:
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.loadDemoAccount('ravi'); window.location.href='/dashboard.html';">
          👨‍🌾 Ravi Kumar (Karnal - Wheat)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.loadDemoAccount('sunita'); window.location.href='/dashboard.html';">
          👩‍🌾 Sunita Devi (Nilokheri - Paddy)
        </button>
      </div>
    </div>

    <!-- Login Box -->
    <div class="card">
      <div style="display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px;">
        <button type="button" id="tab-login" class="btn" style="flex: 1; border-radius: 0; border-bottom: 3px solid var(--primary-light); font-weight: bold;" onclick="toggleAuthTab('login')">
          Sign In
        </button>
        <button type="button" id="tab-signup" class="btn" style="flex: 1; border-radius: 0; color: var(--text-muted);" onclick="toggleAuthTab('signup')">
          New Farm Registration
        </button>
      </div>

      <!-- Sign In Form -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="ravi or sunita" value="ravi" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="password123" required>
          <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block;">Default demo password: <code>password123</code></span>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Sign In to Farm Dashboard →
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" style="display: none;" onsubmit="handleSignupSubmit(event)">
        <div class="form-group">
          <label class="form-label">Farmer Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="e.g. Ramesh Singh" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input type="tel" id="signup-phone" class="form-control" placeholder="+91 98120..." required>
          </div>
          <div class="form-group">
            <label class="form-label">Village / District</label>
            <input type="text" id="signup-village" class="form-control" placeholder="Kachhwa, Karnal" required>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">Primary Crop</label>
            <select id="signup-crop" class="form-control">
              <option value="Wheat">Wheat (गेहूं)</option>
              <option value="Paddy (Rice)">Paddy / Basmati (धान)</option>
              <option value="Mustard">Mustard (सरसों)</option>
              <option value="Cotton">Cotton (कपास)</option>
              <option value="Sugarcane">Sugarcane (गन्ना)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Land Area</label>
            <div style="display: flex; gap: 4px;">
              <input type="number" id="signup-area-val" class="form-control" value="2.5" step="0.1" style="width: 65%;">
              <select id="signup-area-unit" class="form-control" style="width: 35%;">
                <option value="Acre">Acre</option>
                <option value="Hectare">Ha</option>
                <option value="Bigha">Bigha</option>
                <option value="Kanal">Kanal</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Choose Username</label>
          <input type="text" id="signup-username" class="form-control" placeholder="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Choose Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Register Farm & Generate Telemetry →
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/localization.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function toggleAuthTab(tab) {
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        tabLogin.style.borderBottom = '3px solid var(--primary-light)';
        tabLogin.style.color = 'var(--text-main)';
        tabSignup.style.borderBottom = 'none';
        tabSignup.style.color = 'var(--text-muted)';
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        tabSignup.style.borderBottom = '3px solid var(--primary-light)';
        tabSignup.style.color = 'var(--text-main)';
        tabLogin.style.borderBottom = 'none';
        tabLogin.style.color = 'var(--text-muted)';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      const res = await Auth.login(u, p);
      if (res.success) {
        window.location.href = '/dashboard.html';
      } else {
        alert(res.message);
      }
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById('signup-name').value,
        phone: document.getElementById('signup-phone').value,
        village: document.getElementById('signup-village').value,
        crop: document.getElementById('signup-crop').value,
        area_value: parseFloat(document.getElementById('signup-area-val').value),
        area_unit: document.getElementById('signup-area-unit').value,
        username: document.getElementById('signup-username').value,
        password: document.getElementById('signup-password').value
      };
      const res = await Auth.signup(payload);
      if (res.success) {
        window.location.href = '/dashboard.html';
      } else {
        alert(res.message);
      }
    }
  </script>
</body>
</html>
